name: Docs link check

on:
  pull_request:
    branches:
      - main
      - 'release**'
    paths:
      - 'docs/**'
      - 'skpro/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/linkcheck.yml'
  schedule:
    - cron: '0 0 * * 6'

  # Allows workflows to be manually triggered
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    name: docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: repository checkout step
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: python environment step
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install skpro and docs dependencies
        shell: bash
        run: uv pip install .[docs] --no-cache-dir
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Show dependencies
        run: uv pip list

      - name: Run sphinx linkcheck
        run: python -m sphinx -b linkcheck -j auto docs/source docs/_build/linkcheck

      - name: Report broken links
        if: failure()
        shell: bash
        run: |
          report=docs/_build/linkcheck/output.txt
          broken=$(grep -F '[broken]' "$report" || true)
          if [ -z "$broken" ]; then
            echo "No broken links in $report, see the log of the linkcheck step."
            exit 0
          fi
          echo "## Broken links" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error title=Broken link::$line"
            echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$broken"

      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/
          retention-days: 7
