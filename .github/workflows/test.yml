name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
      - 'release**'
  pull_request:
    branches:
      - main
      - 'release**'
    paths-ignore:
      - 'docs/**'
    types: [opened, synchronize]

  # Allows workflows to be manually triggered
  workflow_dispatch:

permissions:
  contents: read
  # Needed for the 'trilom/file-changes-action' action
  pull-requests: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: repository checkout step
        uses: actions/checkout@v7

      - name: python environment step
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: install pre-commit
        run: python3 -m pip install pre-commit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tr '\n' ' ')
          echo "CHANGED_FILES=${CHANGED_FILES}" >> $GITHUB_ENV

      - name: Print changed files
        run: |
          echo "Changed files: $CHANGED_FILES"

      - name: Run pre-commit on changed files
        run: |
          if [ -n "$CHANGED_FILES" ]; then
            pre-commit run --color always --files $CHANGED_FILES --show-diff-on-failure
          else
            echo "No changed files to check."
          fi

      - name: check missing __init__ files

        run: build_tools/fail_on_missing_init_files.sh
        shell: bash

  run-notebook-examples:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[all_extras,binder,dev]
      - name: Run example notebooks
        run: build_tools/run_examples.sh
        shell: bash

  detect-changed-classes:
    needs: code-quality
    runs-on: ubuntu-latest
    outputs:
      obj_list: ${{ steps.get-change-list.outputs.obj_list }}
      obj_list_length: ${{ steps.get-change-list.outputs.obj_list_length }}

    steps:
      - uses: actions/checkout@v7

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install skpro with dev dependencies
        run: pip install .[dev]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Get list of names of changed classes
        id: get-change-list
        run: |
          OBJ_LIST=$(python -c 'from skpro.tests.test_switch import _get_all_changed_classes; import json; obj_list = _get_all_changed_classes(vm=True); print(json.dumps(obj_list))')
          OBJ_LIST_LENGTH=$(python -c 'from skpro.tests.test_switch import _get_all_changed_classes; obj_list = _get_all_changed_classes(vm=True); print(len(obj_list))')
          echo "OBJ_LIST=$OBJ_LIST" >> $GITHUB_ENV
          echo "OBJ_LIST_LENGTH=$OBJ_LIST_LENGTH" >> $GITHUB_ENV
          echo "obj_list=$OBJ_LIST" >> $GITHUB_OUTPUT
          echo "obj_list_length=$OBJ_LIST_LENGTH" >> $GITHUB_OUTPUT

      - name: Print changed classes
        run: |
          echo "Number of changed classes: $OBJ_LIST_LENGTH"
          echo "Changed classes: $OBJ_LIST"

  run-tests-no-extras:
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install skpro and dependencies
        shell: bash
        run: uv pip install .[dev] --no-cache-dir
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Show dependencies
        run: uv pip list

      - name: Show available branches
        run: git branch -a

      - name: Run tests
        run: make test

      - name: Publish code coverage
        uses: codecov/codecov-action@v7

  run-tests-all-extras:
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install skpro and dependencies
        shell: bash
        run: uv pip install .[dev] --no-cache-dir
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Show dependencies
        run: uv pip list

      - name: Show available branches
        run: git branch -a

      - name: Run tests
        run: make test

      - name: Publish code coverage
        uses: codecov/codecov-action@v7

  test-est:
    needs: detect-changed-classes
    if: ${{ needs.detect-changed-classes.outputs.obj_list != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJson(needs.detect-changed-classes.outputs.obj_list) }}
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}

      - name: Force non-GUI Matplotlib backend (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: echo "MPLBACKEND=Agg" >> $env:GITHUB_ENV

      - name: Install skpro with dev dependencies
        run: uv pip install .[dev]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Install dependencies for ${{ matrix.flag }}
        run: |
          python -c "from skpro.registry import deps; print('\n'.join(deps('${{ matrix.flag }}', include_test_deps=True)))" > deps.txt
          pip install -r deps.txt
        continue-on-error: true

      - name: Show dependencies
        run: uv pip list

      - name: Run tests with ${{ matrix.flag }}
        env:
          FLAG: ${{ matrix.flag }}
        shell: bash
        run: python -c "from skpro.tests._test_vm import run_test_vm; run_test_vm('${{ matrix.flag }}')"

  test-historical-deps:
    needs: run-tests-no-extras
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # do not fail all combinations if just one fails
      matrix:
        include:
          - exclude-newer: "2023-07-01"
            python-version: "3.11"
          - exclude-newer: "2024-09-01"
            python-version: "3.12"
          - exclude-newer: "2025-09-01"
            python-version: "3.13"
          - exclude-newer: "2026-09-01"
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install skpro and dependencies
        run: >
          uv pip install .[dev]
          --exclude-newer-package "setuptools=false"
          --exclude-newer-package "scikit-base=false"
        env:
          UV_SYSTEM_PYTHON: 1
          UV_EXCLUDE_NEWER: ${{ matrix['exclude-newer'] }}

      - name: Show dependencies
        run: uv pip list

      - name: Run tests
        run: make test

  check-dependency-bounds:
    name: Core dependency upper bound monitor
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python -m pip install packaging

      - name: Check dependency upper bounds
        run: |
          python <<'PY'
          import json
          import sys
          import tomllib
          import urllib.request

          from packaging.requirements import Requirement
          from packaging.version import Version

          PYPI_URL = "https://pypi.org/pypi/{}/json"

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)

          dependencies = project.get("project", {}).get("dependencies", [])
          project_config = project.get("project", {})

          optional_dependencies = project_config.get("optional-dependencies", {})
          all_extras = optional_dependencies.get("all_extras", [])

          dependencies.extend(all_extras)

          if not dependencies:
              print("No core dependencies found.")
              sys.exit(0)

          unsupported = []
          errors = []

          print("Checking dependency upper bounds against PyPI...\n")

          for dependency in dependencies:
              try:
                  requirement = Requirement(dependency)
              except Exception as exc:
                  errors.append(
                      f"{dependency}: invalid requirement: {exc}"
                  )
                  continue

              upper_bounds = [
                  spec
                  for spec in requirement.specifier
                  if spec.operator in ("<", "<=")
              ]

              if not upper_bounds:
                  print(f"  - {requirement.name}: no upper bound")
                  continue

              upper_bound = min(
                  upper_bounds,
                  key=lambda spec: Version(spec.version),
              )

              try:
                  with urllib.request.urlopen(
                      PYPI_URL.format(requirement.name)
                  ) as response:
                      data = json.load(response)
              except Exception as exc:
                  errors.append(
                      f"{requirement.name}: failed to query PyPI: {exc}"
                  )
                  continue

              releases = data.get("releases", {})
              versions = []

              for version_string, files in releases.items():
                  try:
                      version = Version(version_string)
                  except Exception:
                      continue

                  if version.is_prerelease or version.is_devrelease:
                      continue

                  # Ignore releases for which all files are yanked.
                  if not files or all(
                      file.get("yanked", False)
                      for file in files
                  ):
                      continue

                  versions.append(version)

              if not versions:
                  errors.append(
                      f"{requirement.name}: "
                      "could not find a stable PyPI release"
                  )
                  continue

              latest = max(versions)
              bound_version = Version(upper_bound.version)

              if upper_bound.operator == "<":
                  supported = latest < bound_version
              else:
                  supported = latest <= bound_version

              if supported:
                  print(
                      f"  ✓ {requirement.name}: "
                      f"{latest} is allowed by {upper_bound}"
                  )
              else:
                  print(
                      f"  ✗ {requirement.name}: "
                      f"{latest} is blocked by {upper_bound}"
                  )

                  unsupported.append({
                      "name": requirement.name,
                      "requirement": dependency,
                      "latest": str(latest),
                      "upper_bound": str(upper_bound),
                  })

          print()

          if errors:
              print("::group::Errors")
              for error in errors:
                  print(f"  ✗ {error}")
              print("::endgroup::")
              print()

          if unsupported:
              print("::error::Latest dependency releases are not supported.")
              print()
              print("=" * 72)
              print("DEPENDENCY UPPER BOUNDS NEED ATTENTION")
              print("=" * 72)
              print()

              for dependency in unsupported:
                  print(f"  {dependency['name']}")
                  print(f"    declared: {dependency['requirement']}")
                  print(f"    latest:   {dependency['latest']}")
                  print(f"    pyproject bound:  {dependency['upper_bound']}")
                  print()

              print(
                  f"{len(unsupported)} newest release of core "
                  f"{'dependency is' if len(unsupported) == 1 else 'dependencies are'} "
                  "blocked by skpro pyproject.toml upper bounds. "
                  "Please update the upper bounds accordingly, in a separate PR."
              )
              print("=" * 72)

          if errors or unsupported:
              sys.exit(1)

          print("✓ All dependency upper bounds allow the latest "
                "stable PyPI releases.")
          PY
